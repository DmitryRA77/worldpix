<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WORLDPIX</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #06111f;
    color: white;
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   LANGUAGE SCREEN
========================= */

.screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.language-box {
    width: 100%;
    max-width: 720px;
    background: #0b1c30;
    border: 1px solid #1e3855;
    border-radius: 24px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 10px;
}

.logo span {
    color: #38a9ff;
}

.subtitle {
    color: #9eb2c9;
    margin-bottom: 30px;
}

.languages {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.language-btn {
    background: #102943;
    color: white;
    border: 1px solid #244866;
    border-radius: 14px;
    padding: 16px 10px;
    transition: .2s;
}

.language-btn:hover {
    background: #174066;
    transform: translateY(-2px);
}

.language-btn.active {
    border-color: #38a9ff;
    background: #123b60;
}

/* =========================
   MAIN APP
========================= */

#app {
    display: none;
    min-height: 100vh;
}

.header {
    height: 70px;
    background: #081827;
    border-bottom: 1px solid #1c354e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    position: relative;
    z-index: 20;
}

.header-logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 3px;
}

.header-logo span {
    color: #38a9ff;
}

.header-right {
    display: flex;
    gap: 10px;
    align-items: center;
}

.header-btn {
    background: #102943;
    color: white;
    border: 1px solid #254966;
    border-radius: 10px;
    padding: 9px 14px;
}

.header-btn:hover {
    background: #174066;
}

/* =========================
   NAVIGATION
========================= */

.location-bar {
    background: #0a1d31;
    border-bottom: 1px solid #1b354e;
    padding: 15px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.location-item {
    background: #102943;
    border: 1px solid #244866;
    padding: 8px 12px;
    border-radius: 9px;
    color: #d9e9f8;
}

.location-arrow {
    color: #5e7994;
}

/* =========================
   MAP AREA
========================= */

.map-layout {
    display: flex;
    height: calc(100vh - 125px);
    min-height: 550px;
}

.map-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #102c46 0%, #06111f 65%);
}

.map-world {
    position: absolute;
    width: 1600px;
    height: 1000px;
    left: 50%;
    top: 50%;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
}

/*
   This is a visual prototype of a city.
   The real geographic map will be connected later.
*/

.city-shape {
    position: absolute;
    left: 300px;
    top: 160px;
    width: 1000px;
    height: 650px;
    background: #102b43;
    border: 2px solid #31526d;
    clip-path: polygon(
        5% 20%,
        17% 8%,
        34% 13%,
        48% 5%,
        65% 13%,
        83% 9%,
        96% 25%,
        92% 43%,
        98% 59%,
        83% 76%,
        69% 71%,
        57% 90%,
        40% 83%,
        26% 94%,
        12% 77%,
        4% 60%,
        10% 43%
    );
}

/* grid */

.plot-grid {
    position: absolute;
    left: 300px;
    top: 160px;
    width: 1000px;
    height: 650px;

    display: grid;
    grid-template-columns: repeat(40, 1fr);
    grid-template-rows: repeat(26, 1fr);

    clip-path: polygon(
        5% 20%,
        17% 8%,
        34% 13%,
        48% 5%,
        65% 13%,
        83% 9%,
        96% 25%,
        92% 43%,
        98% 59%,
        83% 76%,
        69% 71%,
        57% 90%,
        40% 83%,
        26% 94%,
        12% 77%,
        4% 60%,
        10% 43%
    );
}

.plot {
    border-right: 1px solid rgba(98,150,190,.18);
    border-bottom: 1px solid rgba(98,150,190,.18);
    background: rgba(20,55,83,.28);
    transition: background .12s;
}

.plot:hover {
    background: rgba(56,169,255,.45);
}

.plot.owned {
    background: rgba(56,169,255,.55);
}

.plot.free {
    background: rgba(67,190,125,.42);
}

.plot.selected {
    background: rgba(255,184,77,.8);
    box-shadow: inset 0 0 0 2px white;
}

/* =========================
   MAP CONTROLS
========================= */

.map-controls {
    position: absolute;
    right: 20px;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
}

.zoom-btn {
    width: 45px;
    height: 45px;
    border-radius: 12px;
    border: 1px solid #31536e;
    background: #0b2035;
    color: white;
    font-size: 22px;
}

.zoom-btn:hover {
    background: #163a59;
}

.zoom-level {
    background: #0b2035;
    border: 1px solid #31536e;
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    color: #a8bed3;
}

/* =========================
   SIDE PANEL
========================= */

.side-panel {
    width: 340px;
    background: #091a2c;
    border-left: 1px solid #1c354e;
    padding: 22px;
    overflow-y: auto;
}

.panel-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 6px;
}

.panel-subtitle {
    color: #829ab1;
    font-size: 13px;
    margin-bottom: 22px;
}

.stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
}

.stat {
    background: #0d243a;
    border: 1px solid #1d405d;
    padding: 14px;
    border-radius: 12px;
}

.stat-label {
    color: #819bb4;
    font-size: 11px;
    margin-bottom: 5px;
}

.stat-value {
    font-size: 17px;
    font-weight: bold;
}

.info-box {
    background: #0d243a;
    border: 1px solid #1d405d;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 15px;
}

.info-label {
    color: #829ab1;
    font-size: 12px;
    margin-bottom: 5px;
}

.info-value {
    font-weight: bold;
    word-break: break-word;
}

.buy-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #1689df;
    color: white;
    font-weight: bold;
    margin-top: 8px;
}

.buy-btn:hover {
    background: #249be9;
}

.buy-btn:disabled {
    background: #32495d;
    cursor: not-allowed;
}

/* =========================
   BOTTOM LEGEND
========================= */

.legend {
    position: absolute;
    left: 20px;
    bottom: 20px;
    background: rgba(7,23,39,.92);
    border: 1px solid #294861;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    gap: 14px;
    font-size: 12px;
    z-index: 10;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
}

.dot-free {
    background: #43be7d;
}

.dot-owned {
    background: #38a9ff;
}

.dot-selected {
    background: #ffb84d;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .languages {
        grid-template-columns: repeat(2, 1fr);
    }

    .language-box {
        padding: 25px 18px;
    }

    .logo {
        font-size: 34px;
    }

    .header {
        padding: 0 12px;
    }

    .header-btn {
        padding: 8px 9px;
        font-size: 12px;
    }

    .map-layout {
        flex-direction: column;
        height: auto;
    }

    .map-container {
        height: 65vh;
        min-height: 430px;
    }

    .side-panel {
        width: 100%;
        border-left: none;
        border-top: 1px solid #1c354e;
    }

    .legend {
        left: 10px;
        bottom: 10px;
        gap: 8px;
        font-size: 10px;
    }

    .location-bar {
        padding: 10px;
        font-size: 12px;
    }

    .map-world {
        width: 1100px;
        height: 700px;
    }

    .city-shape,
    .plot-grid {
        left: 150px;
        top: 120px;
        width: 800px;
        height: 500px;
    }
}
</style>
</head>

/* ============================================================
   GLOBAL STATE
============================================================ */

let currentLanguage =
    localStorage.getItem("worldpix_language") || null;

let selectedCountry = null;

let selectedCity = null;

let selectedPlot = null;

let zoom = 1;


/* ============================================================
   LANGUAGE SCREEN
============================================================ */

function buildLanguages() {

    const container =
        document.getElementById("languages");

    container.innerHTML = "";

    languages.forEach(language => {

        const button =
            document.createElement("button");

        button.className = "language-btn";

        button.innerHTML =
            language.flag + " " + language.name;

        button.onclick = () =>
            selectLanguage(language.id);

        container.appendChild(button);

    });

}


/* ============================================================
   SELECT LANGUAGE
============================================================ */

function selectLanguage(languageId) {

    currentLanguage = languageId;

    localStorage.setItem(
        "worldpix_language",
        languageId
    );

    document.documentElement.lang =
        languageId;

    document.getElementById(
        "languageScreen"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).style.display = "block";

    updateTexts();

    startWorldPix();

}


/* ============================================================
   TRANSLATION
============================================================ */

function updateTexts() {

    const lang =
        T[currentLanguage] || T.en;

    document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

            const key =
                element.getAttribute("data-i18n");

            if (lang[key]) {
                element.textContent =
                    lang[key];
            }

        });

    document.getElementById(
        "languageSubtitle"
    ).textContent =
        lang.languageSubtitle;

}


/* ============================================================
   START
============================================================ */

function startWorldPix() {

    /*
       Demo location.
       Later this will be replaced with:
       language → country → city → map
    */

    selectedCountry =
        locations.ru;

    selectedCity =
        locations.ru.cities[0];

    updateLocationDisplay();

    createPlots();

}


/* ============================================================
   LOCATION DISPLAY
============================================================ */

function getLocalizedName(object) {

    if (!object || !object.names) {
        return "";
    }

    return (
        object.names[currentLanguage] ||
        object.names.en ||
        object.names.ru ||
        ""
    );

}


function updateLocationDisplay() {

    document.getElementById(
        "countryDisplay"
    ).textContent =
        "🌍 " + getLocalizedName(selectedCountry);

    document.getElementById(
        "cityDisplay"
    ).textContent =
        "🏙️ " + getLocalizedName(selectedCity);

}


/* ============================================================
   CREATE MAP PLOTS
============================================================ */

function createPlots() {

    const grid =
        document.getElementById("plotGrid");

    grid.innerHTML = "";

    /*
       IMPORTANT:

       We do NOT create 100,000,000 DOM elements.

       This demo displays only 40 × 26 = 1040
       visible prototype cells.

       The real WORLDPIX system will use
       Canvas/WebGL/virtual rendering.
    */

    const columns = 40;

    const rows = 26;

    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < columns; x++) {

            const plot =
                document.createElement("div");

            plot.className = "plot";

            /*
               Simulated statuses
            */

            const random =
                Math.random();

            if (random < 0.06) {

                plot.classList.add("owned");

            } else if (random < 0.13) {

                plot.classList.add("free");

            }

            const plotId =
                createPlotId(x, y);

            plot.dataset.id =
                plotId;

            plot.dataset.x =
                x;

            plot.dataset.y =
                y;

            plot.addEventListener(
                "click",
                () => selectPlot(
                    plot,
                    x,
                    y,
                    plotId
                )
            );

            grid.appendChild(plot);

        }

    }

}


/* ============================================================
   PLOT ID
============================================================ */

function createPlotId(x, y) {

    const city =
        selectedCity
            ? selectedCity.id.toUpperCase()
            : "CITY";

    return (
        "WPX-" +
        city +
        "-" +
        String(x).padStart(4, "0") +
        "-" +
        String(y).padStart(4, "0")
    );

}


/* ============================================================
   SELECT PLOT
============================================================ */

function selectPlot(
    element,
    x,
    y,
    plotId
) {

    document
        .querySelectorAll(".plot.selected")
        .forEach(plot => {

            plot.classList.remove("selected");

        });

    element.classList.add("selected");

    selectedPlot = {

        id: plotId,

        x: x,

        y: y,

        element: element

    };

    const isOwned =
        element.classList.contains("owned");

    const isFree =
        element.classList.contains("free");

    let status;

    if (isOwned) {

        status =
            T[currentLanguage].occupied;

    } else if (isFree) {

        status =
            T[currentLanguage].available;

    } else {

        status =
            T[currentLanguage].available;

    }

    document.getElementById(
        "plotId"
    ).textContent =
        plotId;

    document.getElementById(
        "plotStatus"
    ).textContent =
        status;

    document.getElementById(
        "plotPrice"
    ).textContent =
        "€1";

    document.getElementById(
        "plotCoordinates"
    ).textContent =
        "X: " + x + " / Y: " + y;

    const buyButton =
        document.getElementById(
            "buyButton"
        );

    buyButton.disabled =
        isOwned;

    buyButton.textContent =
        isOwned
            ? T[currentLanguage].occupied
            : T[currentLanguage].buy;

}


/* ============================================================
   BUY
============================================================ */

function buyPlot() {

    if (!selectedPlot) {

        return;

    }

    alert(
        T[currentLanguage].comingSoon
    );

}


/* ============================================================
   ZOOM
============================================================ */

function applyZoom() {

    const map =
        document.getElementById(
            "mapWorld"
        );

    map.style.transform =
        "translate(-50%, -50%) scale(" +
        zoom +
        ")";

    document.getElementById(
        "zoomLevel"
    ).textContent =
        Math.round(zoom * 100) + "%";

}


function zoomIn() {

    zoom += 0.15;

    if (zoom > 3) {
        zoom = 3;
    }

    applyZoom();

}


function zoomOut() {

    zoom -= 0.15;

    if (zoom < 0.5) {
        zoom = 0.5;
    }

    applyZoom();

}


function resetZoom() {

    zoom = 1;

    applyZoom();

}


/* ============================================================
   DRAG / PAN
============================================================ */

let dragging = false;

let startX = 0;

let startY = 0;

let currentX = 0;

let currentY = 0;

const mapContainer =
    document.getElementById(
        "mapContainer"
    );

const mapWorld =
    document.getElementById(
        "mapWorld"
    );


mapContainer.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target.classList.contains(
                "plot"
            )
        ) {
            return;
        }

        dragging = true;

        startX =
            event.clientX - currentX;

        startY =
            event.clientY - currentY;

        mapContainer.setPointerCapture(
            event.pointerId
        );

    }
);


mapContainer.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }

        currentX =
            event.clientX - startX;

        currentY =
            event.clientY - startY;

        mapWorld.style.marginLeft =
            currentX + "px";

        mapWorld.style.marginTop =
            currentY + "px";

    }
);


mapContainer.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);

}

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORLDPIX —  World</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      overflow: hidden;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #0b1728;
      border-bottom: 1px solid #20324a;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .logo span {
      color: #4da3ff;
    }

    .stats {
      font-size: 14px;
      color: #9eb1c8;
    }

    .map {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #101d2d;

      background-image:
        linear-gradient(rgba(77,163,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77,163,255,.12) 1px, transparent 1px);

      background-size: 40px 40px;

      cursor: crosshair;
    }

    .continent {
      position: absolute;
      background: #243a50;
      border: 1px solid #47637e;
      opacity: .9;
    }

    .c1 {
      width: 240px;
      height: 140px;
      left: 10%;
      top: 20%;
      border-radius: 55% 35% 45% 30%;
      transform: rotate(-8deg);
    }

    .c2 {
      width: 190px;
      height: 260px;
      left: 38%;
      top: 28%;
      border-radius: 40% 55% 35% 50%;
      transform: rotate(12deg);
    }

    .c3 {
      width: 280px;
      height: 170px;
      right: 10%;
      top: 18%;
      border-radius: 40% 50% 35% 60%;
      transform: rotate(5deg);
    }

    .c4 {
      width: 150px;
      height: 210px;
      right: 22%;
      bottom: 8%;
      border-radius: 45% 35% 55% 40%;
      transform: rotate(-15deg);
    }

    .panel {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 280px;
      padding: 18px;
      background: rgba(11, 23, 40, .94);
      border: 1px solid #29435f;
      border-radius: 14px;
      z-index: 5;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .panel p {
      color: #9eb1c8;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #287fe5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3992f5;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      WORLD<span>PIX</span>
    </div>

    <div class="stats">
      100 000 000 участков
    </div>
  </header>

  <main class="map">

    <div class="continent c1"></div>
    <div class="continent c2"></div>
    <div class="continent c3"></div>
    <div class="continent c4"></div>

    <div class="panel">
      <h2>🌍 WORLDPIX</h2>

      <p>
        Интерактивный цифровой мир,
        где каждый участок карты может
        принадлежать пользователю.
      </p>

      <button onclick="alert('Скоро здесь появится система участков WORLDPIX!')">
        Исследовать мир
      </button>
    </div>

  </main>

</body>
</html>
